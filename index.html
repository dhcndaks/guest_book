<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>우리 반 방명록</title>
    <link rel="stylesheet" href="index.css">
    <!-- Google Fonts: Pretendard -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="app-container">
        <header>
            <button class="icon-btn" id="menu-btn">☰</button>
            <h1>우리 반 방명록</h1>
            <button class="icon-btn" id="noti-btn">🔔</button>
        </header>

        <div class="tabs">
            <div class="tab active" data-tab="all">전체 글</div>
            <div class="tab" data-tab="mine">내 글</div>
        </div>

        <main id="post-list">
            <div class="loading">데이터를 불러오는 중...</div>
        </main>

        <form class="input-bar" id="post-form">
            <input type="text" id="post-input" placeholder="메시지를 입력하세요..." required>
            <button type="submit" class="submit-btn">등록</button>
        </form>
    </div>

    <script src="app.js"></script>
</body>
</html>
